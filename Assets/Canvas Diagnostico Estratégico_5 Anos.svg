  <text x="465" y="362" font-family="Segoe UI, sans-serif" font-size="10" fill="#666">Metas de curto prazo,</text>
  <text x="465" y="376" font-family="Segoe UI, sans-serif" font-size="10" fill="#666">ações imediatas</text>

  <!-- Bloco Forças e Fraquezas -->
  <rect x="850" y="100" width="390" height="300" rx="8" ry="8" fill="white" stroke="#2ecc71" stroke-width="2"/>
