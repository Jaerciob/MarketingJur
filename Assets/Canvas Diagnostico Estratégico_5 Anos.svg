  <text x="60" y="480" font-family="Segoe UI, sans-serif" font-size="11" font-style="italic" fill="#444">Como posso usar minhas forças para</text>
  <text x="60" y="494" font-family="Segoe UI, sans-serif" font-size="11" font-style="italic" fill="#444">aproveitar as oportunidades?</text>

  <rect x="50" y="505" width="370" height="160" rx="6" ry="6" fill="#f4fbf7" stroke="#a8d5b5" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="65" y="530" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#27ae60">1.</text>
  <line x1="85" y1="527" x2="400" y2="527" stroke="#ccc" stroke-width="1"/>
  <line x1="65" y1="552" x2="400" y2="552" stroke="#ccc" stroke-width="1"/>
  <text x="65" y="600" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#27ae60">2.</text>
  <line x1="85" y1="597" x2="400" y2="597" stroke="#ccc" stroke-width="1"/>
  <line x1="65" y1="622" x2="400" y2="622" stroke="#ccc" stroke-width="1"/>

  <!-- Forças x Ameaças -->
  <rect x="445" y="420" width="390" height="260" rx="8" ry="8" fill="white" stroke="#e67e22" stroke-width="2"/>
  <rect x="455" y="430" width="370" height="35" rx="6" ry="6" fill="#e67e22"/>
  <text x="640" y="453" font-family="Segoe UI, sans-serif" font-size="15" font-weight="bold" fill="white" text-anchor="middle">Forças x Ameaças</text>
  <text x="465" y="480" font-family="Segoe UI, sans-serif" font-size="11" font-style="italic" fill="#444">Como posso usar minhas forças para me</text>
  <text x="465" y="494" font-family="Segoe UI, sans-serif" font-size="11" font-style="italic" fill="#444">proteger ou neutralizar as ameaças?</text>

  <rect x="455" y="505" width="370" height="160" rx="6" ry="6" fill="#fdf5ec" stroke="#f0c48a" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="470" y="530" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#e67e22">1.</text>
  <line x1="490" y1="527" x2="805" y2="527" stroke="#ccc" stroke-width="1"/>
  <line x1="470" y1="552" x2="805" y2="552" stroke="#ccc" stroke-width="1"/>
  <text x="470" y="600" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#e67e22">2.</text>
  <line x1="490" y1="597" x2="805" y2="597" stroke="#ccc" stroke-width="1"/>
  <line x1="470" y1="622" x2="805" y2="622" stroke="#ccc" stroke-width="1"/>

  <!-- Fraquezas x Oportunidades -->
  <rect x="850" y="420" width="390" height="260" rx="8" ry="8" fill="white" stroke="#8e44ad" stroke-width="2"/>
  <rect x="860" y="430" width="370" height="35" rx="6" ry="6" fill="#8e44ad"/>
  <text x="1045" y="453" font-family="Segoe UI, sans-serif" font-size="14.5" font-weight="bold" fill="white" text-anchor="middle">Fraquezas x Oportunidades</text>
  <text x="870" y="480" font-family="Segoe UI, sans-serif" font-size="11" font-style="italic" fill="#444">Quais fraquezas preciso corrigir para não</text>
  <text x="870" y="494" font-family="Segoe UI, sans-serif" font-size="11" font-style="italic" fill="#444">perder as oportunidades?</text>

  <rect x="860" y="505" width="370" height="160" rx="6" ry="6" fill="#f8f3fa" stroke="#d4b3e0" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="875" y="530" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#8e44ad">1.</text>
  <line x1="895" y1="527" x2="1210" y2="527" stroke="#ccc" stroke-width="1"/>
  <line x1="875" y1="552" x2="1210" y2="552" stroke="#ccc" stroke-width="1"/>
  <text x="875" y="600" font-family="Segoe UI, sans-serif" font-size="13" font-weight="bold" fill="#8e44ad">2.</text>
  <line x1="895" y1="597" x2="1210" y2="597" stroke="#ccc" stroke-width="1"/>
  <line x1="875" y1="622" x2="1210" y2="622" stroke="#ccc" stroke-width="1"/>
