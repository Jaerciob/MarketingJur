  <text x="640" y="80" font-family="Segoe UI, sans-serif" font-size="9.5" fill="#a9c2e0" text-anchor="middle">Conforme as regras éticas da OAB</text>

  <!-- ===================== LINHA 1 ===================== -->

  <!-- Bloco Mercado Jurídico (Oportunidades/Ameaças) -->
  <rect x="40" y="100" width="390" height="300" rx="8" ry="8" fill="white" stroke="#3498db" stroke-width="2"/>
  <rect x="50" y="110" width="370" height="35" rx="6" ry="6" fill="#3498db"/>
  <text x="235" y="133" font-family="Segoe UI, sans-serif" font-size="17" font-weight="bold" fill="white" text-anchor="middle">Mercado Jurídico</text>
  <text x="235" y="160" font-family="Segoe UI, sans-serif" font-size="11" fill="#666" text-anchor="middle">Oportunidades e Ameaças</text>

  <rect x="50" y="175" width="175" height="100" rx="6" ry="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/>
  <text x="60" y="196" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#1e7e46">🟢 Oportunidade 1</text>
  <text x="60" y="212" font-family="Segoe UI, sans-serif" font-size="9.5" fill="#2f9e5f">Descreva a oportunidade</text>
  <text x="60" y="225" font-family="Segoe UI, sans-serif" font-size="9.5" fill="#2f9e5f">identificada</text>

  <rect x="235" y="175" width="175" height="100" rx="6" ry="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/>
