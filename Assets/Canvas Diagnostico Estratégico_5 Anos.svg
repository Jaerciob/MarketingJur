  <text x="870" y="225" font-family="Segoe UI, sans-serif" font-size="9.5" fill="#666">forte identificado</text>

  <rect x="1045" y="175" width="175" height="100" rx="6" ry="6" fill="#eaeaea" stroke="#aaa" stroke-width="1" stroke-dasharray="5,5"/>
