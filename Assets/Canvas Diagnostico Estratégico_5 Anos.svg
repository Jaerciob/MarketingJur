  <text x="1055" y="212" font-family="Segoe UI, sans-serif" font-size="9.5" fill="#666">Descreva o ponto</text>
  <text x="1055" y="225" font-family="Segoe UI, sans-serif" font-size="9.5" fill="#666">forte identificado</text>

  <rect x="860" y="283" width="175" height="100" rx="6" ry="6" fill="#eaeaea" stroke="#aaa" stroke-width="1" stroke-dasharray="5,5"/>
