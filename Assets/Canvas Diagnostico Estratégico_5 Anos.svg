<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#f5f5f5"/>

  <!-- Cabeçalho -->
  <rect x="40" y="20" width="1200" height="70" rx="8" ry="8" fill="#022859"/>
  <text x="640" y="48" font-family="Segoe UI, sans-serif" font-size="22" font-weight="bold" fill="white" text-anchor="middle">Marketing Estratégico: Canvas de Diagnóstico</text>
