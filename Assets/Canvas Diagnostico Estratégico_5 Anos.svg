  <text x="245" y="212" font-family="Segoe UI, sans-serif" font-size="9.5" fill="#2f9e5f">Descreva a oportunidade</text>
  <text x="245" y="225" font-family="Segoe UI, sans-serif" font-size="9.5" fill="#2f9e5f">identificada</text>

  <rect x="50" y="283" width="175" height="100" rx="6" ry="6" fill="#fdebd0" stroke="#e67e22" stroke-width="1.5"/>
  <text x="60" y="304" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#7d4a0f">🔴 Ameaça 1</text>
  <text x="60" y="320" font-family="Segoe UI, sans-serif" font-size="9.5" fill="#8a5a20">Descreva a ameaça</text>
  <text x="60" y="333" font-family="Segoe UI, sans-serif" font-size="9.5" fill="#8a5a20">identificada</text>

  <rect x="235" y="283" width="175" height="100" rx="6" ry="6" fill="#fdebd0" stroke="#e67e22" stroke-width="1.5"/>
  <text x="245" y="304" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#7d4a0f">🔴 Ameaça 2</text>
  <text x="245" y="320" font-family="Segoe UI, sans-serif" font-size="9.5" fill="#8a5a20">Descreva a ameaça</text>
  <text x="245" y="333" font-family="Segoe UI, sans-serif" font-size="9.5" fill="#8a5a20">identificada</text>

  <!-- Bloco Objetivos (ordem invertida com Visão) -->
  <rect x="445" y="100" width="390" height="300" rx="8" ry="8" fill="white" stroke="#e74c3c" stroke-width="2"/>
