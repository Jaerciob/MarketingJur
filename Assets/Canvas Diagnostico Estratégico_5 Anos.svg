  <text x="870" y="320" font-family="Segoe UI, sans-serif" font-size="9.5" fill="#666">Descreva o ponto</text>
  <text x="870" y="333" font-family="Segoe UI, sans-serif" font-size="9.5" fill="#666">fraco identificado</text>

  <rect x="1045" y="283" width="175" height="100" rx="6" ry="6" fill="#eaeaea" stroke="#aaa" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="1055" y="304" font-family="Segoe UI, sans-serif" font-size="12" font-weight="bold" fill="#333">⚡ Fraqueza 2</text>
  <text x="1055" y="320" font-family="Segoe UI, sans-serif" font-size="9.5" fill="#666">Descreva o ponto</text>
  <text x="1055" y="333" font-family="Segoe UI, sans-serif" font-size="9.5" fill="#666">fraco identificado</text>

  <!-- ===================== LINHA 2 (Matriz Cruzada) ===================== -->

  <!-- Forças x Oportunidades -->
  <rect x="40" y="420" width="390" height="260" rx="8" ry="8" fill="white" stroke="#27ae60" stroke-width="2"/>
  <rect x="50" y="430" width="370" height="35" rx="6" ry="6" fill="#27ae60"/>
