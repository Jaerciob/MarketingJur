  <text x="640" y="160" font-family="Segoe UI, sans-serif" font-size="11" fill="#666" text-anchor="middle">Onde Quero Chegar</text>

  <rect x="455" y="175" width="370" height="68" rx="6" ry="6" fill="#eaeaea" stroke="#aaa" stroke-width="1" stroke-dasharray="5,5"/>
